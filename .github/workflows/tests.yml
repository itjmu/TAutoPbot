name: Tests
on: [push, pull_request]
jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check bot.py config.py manage.py app services tests
      - run: python -m ruff format --check bot.py config.py manage.py app services tests
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bot.py config.py manage.py app services tests
